# No npm install: all tests use the built-in Node.js test runner.
name: DebutFlow tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check JavaScript syntax
        run: |
          node --check openings.js
          node --check comments.js
          node --check progress.js
          node --check trainer.js
      - name: Run unit and regression tests
        run: node --test tests/*.test.cjs

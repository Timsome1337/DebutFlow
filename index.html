<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="description" content="DebutFlow — шахматный тренажёр дебютов">
    <title>DebutFlow — тренажёр шахматных дебютов</title>

    <link rel="preconnect" href="https://code.jquery.com">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>♜ DebutFlow ♞</h1>
            <p id="headerSubtitle">Тренажёр шахматных дебютов</p>
        </div>

        <div class="library-panel">
            <div class="select-group opening-group">
                <label for="openingSelect">Дебют</label>
                <select id="openingSelect" class="db-select"></select>
            </div>
            <button id="randomVariationBtn" class="control-btn random-btn">🎲 Другая случайная линия</button>
            <div class="opening-meta">
                <span id="sideBadge" class="side-badge">За белых</span>
                <span id="lineCounter" class="line-counter">Случайная линия</span>
            </div>
        </div>

        <div class="main-content">
            <div class="board-section">
                <div class="current-opening-card">
                    <div id="currentOpeningName" class="current-opening-name">Дебют</div>
                    <div id="currentVariationName" class="current-variation-name">Случайная линия</div>
                </div>

                <div class="board-wrapper">
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <div>Загрузка доски...</div>
                    </div>
                    <div id="board"></div>
                </div>

                <div class="controls-panel">
                    <div class="mode-buttons">
                        <button id="modeStudyBtn" class="control-btn mode-btn">📚 Изучение ходов</button>
                        <button id="modePracticeBtn" class="control-btn mode-btn">🎯 Практика</button>
                    </div>
                    <div class="action-buttons" id="actionButtons">
                        <button id="nextBtn" class="control-btn" style="display:none;">▶ Далее</button>
                        <button id="prevBtn" class="control-btn" style="display:none;">◀ Назад</button>
                        <button id="hintBtn" class="control-btn" style="display:none;">💡 Подсказка</button>
                        <button id="resetBtn" class="control-btn">🔄 Заново</button>
                        <button id="nextVariationBtn" class="control-btn" style="display:none;">⏩ Следующая случайная линия</button>
                    </div>
                    <div class="progress-container">
                        <span class="progress-label">Ходы:</span>
                        <span class="progress-text" id="progressText">0/0</span>
                    </div>
                </div>
            </div>

            <div class="chat-section">
                <div class="chat-header">
                    <span class="chat-icon">💬</span>
                    <span>ТРЕНЕР DEBUTFLOW</span>
                    <button id="clearChatBtn" class="clear-chat">🗑️ Очистить</button>
                </div>
                <div class="chat-messages" id="chatMessages"></div>
            </div>
        </div>
    </div>

    <noscript>
        <div style="text-align:center;padding:20px;color:white;">Для работы DebutFlow необходим JavaScript.</div>
    </noscript>

    <script src="openings.js"></script>
    <script src="trainer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DebutFlow — проверка PGN (браузер)</title>
<style>body{font:16px system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js" integrity="sha512-xRllwz2gdZciIB+AkEbeq+gVhX8VB8XsfqeFbUh+SzHlN96dEduwtTuVuc2u9EROlmW9+yhRlxjif66ORpsgVA==" crossorigin="anonymous"></script>
<script src="../openings.js"></script>
</head>
<body>
<h1>Проверка шахматных линий DebutFlow</h1>
<p>Проверяет последовательности ходов через настоящую chess.js 0.10.3 в браузере. Эта страница — инструмент проверки, не пользовательский экран тренажёра.</p>
<pre id="result">Выполняется проверка...</pre>
<script>
(function () {
  const out = document.getElementById('result');
  if (typeof Chess !== 'function' || !window.OPENINGS_DB) {
    out.textContent = typeof Chess !== 'function'
      ? 'ERROR: chess.js не загрузился. Проверьте интернет, вкладку Network и ошибки SRI в Console браузера.'
      : 'ERROR: база дебютов openings.js не загрузилась. Проверьте вкладку Network и Console браузера.';
    return;
  }
  function tokenizePgn(pgn) {
    if (!pgn) return [];
    return pgn.replace(/\r?\n/g, ' ').replace(/\{[^}]*\}/g, ' ')
      .replace(/\([^)]*\)/g, ' ').replace(/\$\d+/g, ' ').split(/\s+/)
      .map(s => s.trim()).filter(Boolean)
      .map(s => s.replace(/^\d+\.(?:\.\.)?/, ''))
      .filter(s => s && !/^\d+\.{1,3}$/.test(s))
      .filter(s => !['1-0','0-1','1/2-1/2','*'].includes(s));
  }
  const errors = [];
  let count = 0;
  for (const opening of window.OPENINGS_DB.openings || []) {
    for (const variation of opening.lines || []) {
      count++;
      const game = new Chess();
      const tokens = tokenizePgn(variation.pgn);
      if (!tokens.length) { errors.push(`${opening.name}: ${variation.id} — пустой PGN`); continue; }
      for (const token of tokens) {
        try {
          const move = game.move(token, { sloppy: true });
          if (!move) throw new Error('Некорректный ход');
        } catch (e) {
          errors.push(`${opening.name}: ${variation.id}: ${token} (${e.message})`);
          break;
        }
      }
    }
  }
  out.textContent = `${count} линий проверено через chess.js 0.10.3. Ошибок: ${errors.length}.\n` + errors.join('\n');
  console.log('DebutFlow PGN validation', { checked: count, errors });
})();
</script>
</body>
</html>
